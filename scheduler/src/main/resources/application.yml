# Spring Boot scheduler config for Job Scout
# - App name, scheduling, custom agent script path, logging level and server port

spring:
  application:
    name: job-scout-scheduler
  scheduling:
    enabled: true

server:
  port: 8080

jobscout:
  agent:
    script-path: ../agent/main.py
    python-path: python

logging:
  level:
    in.jobscout: INFO
    root: WARN

management:
  endpoints:
    web:
      exposure:
        include: health

